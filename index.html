<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NammaPark — Luxury Parking, Bengaluru</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 20px 40px;
            border-bottom: 1px solid #111111;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        h1 span {
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }
        .status-pill {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 75px);
        }
        .left-panel {
            width: 400px;
            border-right: 1px solid #111111;
            padding: 30px;
            overflow-y: auto;
            background: linear-gradient(180deg, #050505 0%, #000000 100%);
        }
        .panel-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666666;
            margin-bottom: 20px;
        }
        .parking-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }
        .parking-card:hover {
            border-color: #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.1);
            transform: translateY(-2px);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .spot-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }
        .slots-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .slots-green {
            background: rgba(0, 255, 102, 0.1);
            color: #00ff66;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }
        .slots-orange {
            background: rgba(255, 102, 0, 0.1);
            color: #ff6600;
            border: 1px solid rgba(255, 102, 0, 0.2);
        }
        .pricing-section {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .base-price {
            text-decoration: line-through;
            color: #444444;
            font-size: 14px;
        }
        .surge-price {
            color: #00ff66;
            font-size: 20px;
            font-weight: 800;
        }
        .surge-tag {
            background: rgba(0, 255, 102, 0.15);
            color: #00ff66;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 1px;
        }
        .right-panel {
            flex: 1;
            background: #080808;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .map-mockup {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111111 0%, #000000 100%);
            position: relative;
        }
        .map-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .map-pin {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 15px #00ff66, 0 0 30px #00ff66;
            cursor: pointer;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px #00ff66; }
            50% { transform: scale(1.1); box-shadow: 0 0 25px #00ff66, 0 0 40px #00ff66; }
            100% { transform: scale(1); box-shadow: 0 0 15px #00ff66; }
        }
        .engine-text {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 11px;
            color: #444444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Namma<span>Park</span></h1>
        <div class="status-pill">All Systems Nominal</div>
    </header>

    <div class="main-container">
        <div class="left-panel">
            <div class="panel-title">Live Feed · Bengaluru</div>
            
            <div class="parking-card">
                <div class="card-header">
                    <div class="spot-name">Indiranagar 12th Main</div>
                    <div class="slots-badge slots-orange">3 Slots Left</div>
                </div>
                <div class="pricing-section">
                    <span class="base-price">₹40/hr</span>
                    <span class="surge-price">₹75/hr</span>
                    <span class="surge-tag">⚡ PEAK SURGE</span>
                </div>
            </div>

            <div class="parking-card">
                <div class="card-header">
                    <div class="spot-name">MG Road Metro Station</div>
                    <div class="slots-badge slots-green">20 Vacant</div>
                </div>
                <div class="pricing-section">
                    <span class="base-price">₹40/hr</span>
                    <span class="surge-price">₹55/hr</span>
                    <span class="surge-tag" style="background:rgba(255,255,255,0.05); color:#666;">0.4 KM AWAY</span>
                </div>
            </div>

            <div class="parking-card">
                <div class="card-header">
                    <div class="spot-name">Koramangala 3rd Block</div>
                    <div class="slots-badge slots-green">8 Vacant</div>
                </div>
                <div class="pricing-section">
                    <span class="base-price">₹40/hr</span>
                    <span class="surge-price">₹68/hr</span>
                    <span class="surge-tag">⚡ PEAK SURGE</span>
                </div>
            </div>

            <div class="engine-text">Dynamic Pricing Engine Active — rates adjust in real-time.</div>
        </div>

        <div class="right-panel">
            <div class="map-mockup">
                <div class="map-grid"></div>
                <!-- Interactive Glowing Map Pins -->
                <div class="map-pin" style="top: 30%; left: 45%;"></div>
                <div class="map-pin" style="top: 55%; left: 70%; background: #ff6600; box-shadow: 0 0 15px #ff6600;"></div>
                <div class="map-pin" style="top: 75%; left: 35%;"></div>
            </div>
        </div>
    </div>

</body>
</html>
